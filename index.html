
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPost - Public Community</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033}
header{background:#111827;color:white;padding:25px}
header h1{margin:0;font-size:30px}
header p{color:#cbd5e1}
main{max-width:800px;margin:25px auto;padding:12px}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:20px;border:1px solid #e2e8f0}
input,textarea,select{width:100%;padding:14px;margin:8px 0;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
textarea{height:130px;resize:vertical}
button{background:#2563eb;color:white;border:0;padding:14px 20px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.post{border-top:1px solid #eee;padding:18px 0;overflow-wrap:anywhere}
.post h3{margin:0 0 10px}
.post p{white-space:pre-wrap;line-height:1.6}
.meta{color:#64748b;font-size:12px;margin-top:10px}
.status{font-size:14px;margin-top:12px;color:#b91c1c}
</style>
</head>
<body>

<header>
<h1>OpenPost</h1>
<p>A public place to share your thoughts</p>
<select id="language" style="max-width:180px">
<option value="en">English</option>
<option value="bn">বাংলা</option>
<option value="hi">हिन्दी</option>
<option value="ar">العربية</option>
<option value="es">Español</option>
<option value="fr">Français</option>
</select>
</header>

<main>
<section class="card">
<h2 id="heading">Create a public post</h2>
<input id="title" maxlength="120" placeholder="Post title (optional)">
<textarea id="body" maxlength="5000" placeholder="What would you like to share?"></textarea>
<button id="publish" onclick="publishPost()">Publish Post</button>
<p id="status" class="status"></p>
<p>No account or login required. Everyone can see your posts.</p>
</section>

<section class="card">
<h2 id="feedTitle">Community Posts</h2>
<button onclick="loadPosts()">Refresh</button>
<div id="posts">Loading posts...</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hjqucdxsedksrjmfsmeh.supabase.co";
const SUPABASE_KEY = "sb_publishable_MiCaq7WHfdcL1P9tkTS20Q_SZjIOKrn";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const translations = {
en:{heading:"Create a public post",title:"Post title (optional)",body:"What would you like to share?",publish:"Publish Post",feed:"Community Posts",loading:"Loading posts...",empty:"No posts yet!",error:"Something went wrong."},
bn:{heading:"নতুন পোস্ট লিখুন",title:"পোস্টের শিরোনাম",body:"আপনি কী শেয়ার করতে চান?",publish:"পোস্ট প্রকাশ করুন",feed:"সবার পোস্ট",loading:"পোস্ট লোড হচ্ছে...",empty:"এখনো কোনো পোস্ট নেই!",error:"সমস্যা হয়েছে।"},
hi:{heading:"नई पोस्ट बनाएँ",title:"पोस्ट का शीर्षक",body:"आप क्या साझा करना चाहते हैं?",publish:"पोस्ट करें",feed:"सामुदायिक पोस्ट",loading:"लोड हो रहा है...",empty:"अभी कोई पोस्ट नहीं!",error:"कुछ गलत हुआ।"},
ar:{heading:"إنشاء منشور",title:"عنوان المنشور",body:"ماذا تريد أن تشارك؟",publish:"نشر المنشور",feed:"منشورات المجتمع",loading:"جار التحميل...",empty:"لا توجد منشورات!",error:"حدث خطأ."},
es:{heading:"Crear publicación",title:"Título",body:"¿Qué quieres compartir?",publish:"Publicar",feed:"Publicaciones",loading:"Cargando...",empty:"No hay publicaciones.",error:"Ocurrió un error."},
fr:{heading:"Créer une publication",title:"Titre",body:"Que souhaitez-vous partager ?",publish:"Publier",feed:"Publications",loading:"Chargement...",empty:"Aucune publication.",error:"Une erreur est survenue."}
};

let lang="en";

document.getElementById("language").onchange=function(){
lang=this.value;
const t=translations[lang];
document.getElementById("heading").textContent=t.heading;
document.getElementById("title").placeholder=t.title;
document.getElementById("body").placeholder=t.body;
document.getElementById("publish").textContent=t.publish;
document.getElementById("feedTitle").textContent=t.feed;
document.documentElement.dir=lang==="ar"?"rtl":"ltr";
};

function escapeHTML(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

async function publishPost(){
const title=document.getElementById("title").value.trim();
const body=document.getElementById("body").value.trim();
const status=document.getElementById("status");
const button=document.getElementById("publish");

if(!body){status.textContent="Please write something first.";return;}

button.disabled=true;
status.textContent="Publishing...";

const {error}=await db.from("posts").insert({
title:title||null,
body:body,
language:lang
});

button.disabled=false;

if(error){
console.error(error);
status.textContent="Error: "+error.message;
return;
}

document.getElementById("title").value="";
document.getElementById("body").value="";
status.textContent="Post published successfully!";
loadPosts();
}

async function loadPosts(){
const box=document.getElementById("posts");
box.textContent=translations[lang].loading;

const {data,error}=await db
.from("posts")
.select("id,title,body,language,created_at")
.order("created_at",{ascending:false})
.limit(100);

if(error){
console.error(error);
box.textContent=translations[lang].error;
return;
}

if(!data.length){
box.textContent=translations[lang].empty;
return;
}

box.innerHTML="";

data.forEach(post=>{
const div=document.createElement("div");
div.className="post";

div.innerHTML=`
<h3>${escapeHTML(post.title||"Untitled")}</h3>
<p>${escapeHTML(post.body)}</p>
<div class="meta">
Anonymous · ${escapeHTML(new Date(post.created_at).toLocaleString())}
· ${escapeHTML(post.language)}
</div>
`;

box.appendChild(div);
});
}

loadPosts();
</script>
</body>
</html>
