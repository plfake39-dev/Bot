<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>OpenPost — Share with everyone</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f4f6fb}
    *{box-sizing:border-box} body{margin:0} header{background:#111827;color:white;padding:22px 16px}
    .wrap{max-width:850px;margin:auto} .top{display:flex;align-items:center;justify-content:space-between;gap:14px}
    h1{font-size:24px;margin:0} .tag{color:#cbd5e1;font-size:13px;margin-top:5px}
    select, input, textarea, button{font:inherit} select{padding:9px;border-radius:10px;border:1px solid #d5dbea;background:white;color:#172033}
    main{max-width:850px;margin:24px auto;padding:0 14px}
    .card{background:white;border:1px solid #e3e8f2;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #15213b0a}
    h2{font-size:18px;margin:0 0 14px}.field{width:100%;border:1px solid #d5dbea;border-radius:10px;padding:12px;margin:0 0 10px;background:#fff}
    textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{border:0;border-radius:10px;background:#2563eb;color:white;padding:11px 17px;font-weight:650;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#64748b;font-size:13px}.notice{font-size:13px;color:#64748b;margin:8px 0 0}
    .post{border-top:1px solid #edf0f6;padding:16px 0}.post:first-child{border-top:0;padding-top:0}
    .post h3{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}.post p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin:0}
    .meta{display:flex;gap:12px;color:#64748b;font-size:12px;margin-top:10px;flex-wrap:wrap}
    .empty{text-align:center;color:#64748b;padding:25px 5px}.status{font-size:13px;margin-top:10px;min-height:18px}
    .danger{color:#b91c1c}.hidden{display:none}
    footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
    @media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.top select{width:100%}}
  </style>
</head>
<body>
<header><div class="wrap top">
  <div><h1 id="brand">OpenPost</h1><div class="tag" id="tagline">A public place to share your thoughts</div></div>
  <label><span class="hidden" id="languageLabel">Language</span><select id="language" aria-label="Choose language">
    <option value="en">English</option><option value="bn">বাংলা</option><option value="es">Español</option><option value="fr">Français</option><option value="hi">हिन्दी</option><option value="ar">العربية</option>
  </select></label>
</div></header>
<main>
  <section class="card">
    <h2 id="composeTitle">Create a public post</h2>
    <form id="postForm">
      <input class="field" id="postTitle" maxlength="120" placeholder="Post title (optional)" aria-label="Post title">
      <textarea class="field" id="postBody" maxlength="5000" required placeholder="What would you like to share?" aria-label="Post content"></textarea>
      <div class="row"><button id="publish" type="submit">Publish post</button><span class="muted" id="charCount">0 / 5000</span></div>
      <p class="notice" id="privacyNote">No account or login required. Posts are public and can be seen by anyone.</p>
      <div class="status" id="status" role="status"></div>
    </form>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2 id="feedTitle">Community posts</h2><button type="button" id="refresh" style="background:#e8eefc;color:#1d4ed8">Refresh</button></div>
    <div id="feed"><div class="empty">Loading posts…</div></div>
  </section>
</main>
<footer id="footerText">Be respectful. Do not share private information or harmful content.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Add your Supabase Project URL and anon/public key here.
  const SUPABASE_URL = "https://hjqucdxsedksrjmfsmeh.supabase.com";
  const SUPABASE_ANON_KEY = "sb_publishable_MiCaq7WHfdcL1P9tkTS20Q_SZjIOKrn";
  const configured = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
  const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const translations = {
    en:{tagline:"A public place to share your thoughts",compose:"Create a public post",title:"Post title (optional)",body:"What would you like to share?",publish:"Publish post",privacy:"No account or login required. Posts are public and can be seen by anyone.",feed:"Community posts",refresh:"Refresh",loading:"Loading posts…",empty:"No posts yet. Be the first to share something!",errorConfig:"Setup needed: add your Supabase URL and anon key in index.html.",errorLoad:"Could not load posts. Check your database setup and internet connection.",errorPost:"Your post could not be published. Please try again.",success:"Your post is now public.",footer:"Be respectful. Do not share private information or harmful content.",untitled:"Untitled",anonymous:"Anonymous",chars:"characters"},
    bn:{tagline:"আপনার ভাবনা শেয়ার করার উন্মুক্ত জায়গা",compose:"একটি পাবলিক পোস্ট লিখুন",title:"পোস্টের শিরোনাম (ঐচ্ছিক)",body:"আপনি কী শেয়ার করতে চান?",publish:"পোস্ট প্রকাশ করুন",privacy:"কোনো অ্যাকাউন্ট বা লগইন লাগবে না। পোস্ট সবাই দেখতে পারবে।",feed:"সবার পোস্ট",refresh:"রিফ্রেশ",loading:"পোস্ট লোড হচ্ছে…",empty:"এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি আপনিই করুন!",errorConfig:"সেটআপ প্রয়োজন: index.html ফাইলে Supabase URL ও anon key যোগ করুন।",errorLoad:"পোস্ট লোড করা যায়নি। ডাটাবেজ সেটআপ ও ইন্টারনেট সংযোগ দেখুন।",errorPost:"পোস্ট প্রকাশ করা যায়নি। আবার চেষ্টা করুন।",success:"আপনার পোস্ট প্রকাশিত হয়েছে।",footer:"সবার প্রতি সম্মান দেখান। ব্যক্তিগত বা ক্ষতিকর তথ্য শেয়ার করবেন না।",untitled:"শিরোনামহীন",anonymous:"নামহীন",chars:"অক্ষর"},
    es:{tagline:"Un lugar público para compartir tus ideas",compose:"Crear una publicación pública",title:"Título (opcional)",body:"¿Qué quieres compartir?",publish:"Publicar",privacy:"No necesitas cuenta ni iniciar sesión. Todas las publicaciones son públicas.",feed:"Publicaciones",refresh:"Actualizar",loading:"Cargando…",empty:"Aún no hay publicaciones.",errorConfig:"Añade la URL y la clave anon de Supabase en index.html.",errorLoad:"No se pudieron cargar las publicaciones.",errorPost:"No se pudo publicar. Inténtalo de nuevo.",success:"Tu publicación ya es pública.",footer:"Sé respetuoso y no compartas información privada o dañina.",untitled:"Sin título",anonymous:"Anónimo",chars:"caracteres"},
    fr:{tagline:"Un espace public pour partager vos idées",compose:"Créer une publication publique",title:"Titre (facultatif)",body:"Que souhaitez-vous partager ?",publish:"Publier",privacy:"Aucun compte requis. Les publications sont visibles par tous.",feed:"Publications",refresh:"Actualiser",loading:"Chargement…",empty:"Aucune publication pour le moment.",errorConfig:"Ajoutez l’URL et la clé anon Supabase dans index.html.",errorLoad:"Impossible de charger les publications.",errorPost:"Publication impossible. Réessayez.",success:"Votre publication est publique.",footer:"Respectez les autres. Ne partagez pas d’informations privées ou nuisibles.",untitled:"Sans titre",anonymous:"Anonyme",chars:"caractères"},
    hi:{tagline:"अपने विचार साझा करने की सार्वजनिक जगह",compose:"सार्वजनिक पोस्ट बनाएँ",title:"पोस्ट का शीर्षक (वैकल्पिक)",body:"आप क्या साझा करना चाहते हैं?",publish:"पोस्ट प्रकाशित करें",privacy:"खाते या लॉगिन की ज़रूरत नहीं। पोस्ट सभी देख सकते हैं।",feed:"सामुदायिक पोस्ट",refresh:"रीफ़्रेश",loading:"लोड हो रहा है…",empty:"अभी कोई पोस्ट नहीं है।",errorConfig:"index.html में Supabase URL और anon key जोड़ें।",errorLoad:"पोस्ट लोड नहीं हो सके।",errorPost:"पोस्ट प्रकाशित नहीं हुई। फिर कोशिश करें।",success:"आपकी पोस्ट सार्वजनिक है।",footer:"सम्मानजनक रहें। निजी या हानिकारक जानकारी साझा न करें।",untitled:"बिना शीर्षक",anonymous:"अनाम",chars:"अक्षर"},
    ar:{tagline:"مساحة عامة لمشاركة أفكارك",compose:"إنشاء منشور عام",title:"عنوان المنشور (اختياري)",body:"ماذا تريد أن تشارك؟",publish:"نشر",privacy:"لا حاجة إلى حساب أو تسجيل دخول. المنشورات عامة.",feed:"منشورات المجتمع",refresh:"تحديث",loading:"جارٍ التحميل…",empty:"لا توجد منشورات بعد.",errorConfig:"أضف رابط Supabase ومفتاح anon في index.html.",errorLoad:"تعذر تحميل المنشورات.",errorPost:"تعذر نشر المنشور. حاول مرة أخرى.",success:"أصبح منشورك عامًا.",footer:"كن محترمًا ولا تشارك معلومات خاصة أو ضارة.",untitled:"بلا عنوان",anonymous:"مجهول",chars:"حرف"}
  };
  const $ = id => document.getElementById(id);
  let lang = "en";
  function t(key){return translations[lang][key] || translations.en[key]}
  function setLanguage(value){
    lang=value; const x=translations[lang];
    document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
    $("tagline").textContent=x.tagline; $("composeTitle").textContent=x.compose;
    $("postTitle").placeholder=x.title; $("postBody").placeholder=x.body;
    $("publish").textContent=x.publish; $("privacyNote").textContent=x.privacy;
    $("feedTitle").textContent=x.feed; $("refresh").textContent=x.refresh;
    $("footerText").textContent=x.footer; loadPosts();
  }
  $("language").addEventListener("change",e=>setLanguage(e.target.value));
  $("postBody").addEventListener("input",()=>{$("charCount").textContent=$("postBody").value.length+" / 5000";});
  function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function renderPosts(posts){
    const feed=$("feed"); feed.innerHTML="";
    if(!posts.length){feed.innerHTML='<div class="empty">'+escapeHtml(t("empty"))+'</div>';return;}
    for(const p of posts){
      const article=document.createElement("article"); article.className="post";
      const date=new Date(p.created_at).toLocaleString();
      article.innerHTML='<h3>'+escapeHtml(p.title || t("untitled"))+'</h3><p>'+escapeHtml(p.body)+'</p><div class="meta"><span>'+escapeHtml(t("anonymous"))+'</span><span>'+escapeHtml(date)+'</span><span>'+escapeHtml((p.language||"en").toUpperCase())+'</span></div>';
      feed.appendChild(article);
    }
  }
  async function loadPosts(){
    if(!db){$("feed").innerHTML='<div class="empty">'+escapeHtml(t("errorConfig"))+'</div>';return;}
    $("feed").innerHTML='<div class="empty">'+escapeHtml(t("loading"))+'</div>';
    const {data,error}=await db.from("posts").select("id,title,body,language,created_at").order("created_at",{ascending:false}).limit(100);
    if(error){$("feed").innerHTML='<div class="empty">'+escapeHtml(t("errorLoad"))+'</div>';return;}
    renderPosts(data||[]);
  }
  $("refresh").addEventListener("click",loadPosts);
  $("postForm").addEventListener("submit",async e=>{
    e.preventDefault(); const body=$("postBody").value.trim(); const title=$("postTitle").value.trim();
    if(!body)return;
    if(!db){$("status").textContent=t("errorConfig");return;}
    $("publish").disabled=true; $("status").textContent="";
    const {error}=await db.from("posts").insert({title:title||null,body,language:lang});
    $("publish").disabled=false;
    if(error){$("status").textContent=t("errorPost");$("status").className="status danger";return;}
    $("postForm").reset(); $("charCount").textContent="0 / 5000";
    $("status").textContent=t("success");$("status").className="status";
    await loadPosts();
  });
  setLanguage("en");
</script>
</body>
</html>
